<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-itunes-app" content="app-id=6820905528">
  <title>Đấu nối vế 1v1 — Lời Xưa</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FBF8F2;
      --card-bg: #FFFFFF;
      --fg: #2C241D;
      --muted: #7E7062;
      --accent: #B23D26;
      --accent-hover: #962F1B;
      --border: rgba(126, 112, 98, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1612;
        --card-bg: #241F1A;
        --fg: #F5EFE6;
        --muted: #A99B8B;
        --accent: #DE644D;
        --accent-hover: #E87A65;
        --border: rgba(245, 239, 230, 0.15);
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    main {
      max-width: 420px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      box-sizing: border-box;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(178, 61, 38, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px;
      font-family: serif;
    }
    p {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 14px;
    }
    .code-box {
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .code-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .code {
      font: 700 32px/1.2 ui-monospace, Menlo, Monaco, monospace;
      letter-spacing: 6px;
      color: var(--accent);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.button-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px 20px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(178, 61, 38, 0.25);
      transition: background 0.2s;
    }
    a.button-primary:hover {
      background: var(--accent-hover);
    }
    a.button-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      border-radius: 14px;
      background: transparent;
      color: var(--fg);
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid var(--border);
      transition: background 0.15s;
    }
    a.button-secondary:hover {
      background: rgba(126, 112, 98, 0.08);
    }
    .store-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Đấu Nối Vế 1v1</div>
    <h1>Bạn Được Mời Thi Đấu!</h1>
    <p>Đối thủ đang đợi bạn vào so tài 20 câu ca dao nối vế kịch tính.</p>

    <div class="code-box">
      <div class="code-label">Mã phòng thi đấu</div>
      <div class="code" id="code">------</div>
    </div>

    <div class="actions">
      <a class="button-primary" id="openAppBtn" href="cadao://action/duel">
        <span>Mở trong Ứng Dụng Lời Xưa</span>
        <span>➔</span>
      </a>
      <div class="store-grid">
        <a class="button-secondary" href="https://apps.apple.com/app/apple-store/id6820905528?pt=128454365&amp;ct=duel&amp;mt=8" target="_blank" rel="noopener noreferrer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: -2px; margin-right: 6px;">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.67-.82 1.13-1.96 1-3.1-.98.04-2.16.66-2.86 1.48-.61.71-1.15 1.87-.99 2.98 1.1.08 2.21-.57 2.85-1.36z"/>
          </svg>
          App Store
        </a>
        <a class="button-secondary" href="https://tmkstudio.io.vn/loixua-android" target="_blank" rel="noopener noreferrer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: -2px; margin-right: 6px;">
            <path d="M3.609 1.814L13.792 12 3.61 22.186a1.94 1.94 0 0 1-.61-1.39V3.204c0-.528.22-1.01.609-1.39zm11.604 11.607l2.258 2.258-12.01 6.863 9.752-9.121zm0-2.842L5.461 1.458l12.01 6.863-2.258 2.258zm1.421 1.421l3.524 2.014c.951.543.951 1.428 0 1.972l-3.524 2.014-2.259-2.259 2.259-2.141z"/>
          </svg>
          Google Play
        </a>
      </div>
    </div>

    <div class="hint" id="autoRedirectHint">
      Đang tự động chuyển hướng vào ứng dụng...
    </div>
  </main>

  <script>
    // Extract room code from path (/d/<CODE>) or query (?code=<CODE>)
    // Challenge codes (C1_<seed>_..._<dataset>_<checksum>) contain "_" and the dataset version's dots
    // and must stay as written; only 6-character room codes are upper-cased.
    var pathMatch = location.pathname.match(/\/d\/([A-Za-z0-9_.-]+)\/?$/);
    var searchParams = new URLSearchParams(location.search);
    var rawCode = (pathMatch ? pathMatch[1] : (searchParams.get("code") || "")).trim();
    var code = rawCode.indexOf("_") >= 0 ? rawCode : rawCode.toUpperCase();

    if (code.length >= 6) {
      document.getElementById("code").textContent = code;
      var deeplink = "cadao://action/duel?code=" + encodeURIComponent(code);
      document.getElementById("openAppBtn").href = deeplink;

      // Try automatic launch on iOS/iPadOS or Android
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent) || /Android/i.test(navigator.userAgent)) {
        setTimeout(function() {
          window.location.href = deeplink;
        }, 300);
      } else {
        document.getElementById("autoRedirectHint").style.display = "none";
      }
    } else {
      document.getElementById("code").textContent = "KHÔNG HỢP LỆ";
      document.getElementById("autoRedirectHint").style.display = "none";
    }
  </script>
</body>
</html>
