<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="114" ry="114" fill="url(#monoBg)" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>

  <!-- Interconnected Geometric TMK Paths -->
  <g filter="url(#glow)" fill="none" stroke="url(#strokeGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- T: Roof & Stem -->
    <path d="M 76, 170 L 196, 170" />
    <path d="M 136, 170 L 136, 350" />

    <!-- M: Left Leg, Peak, Center Dip, Right Leg -->
    <path d="M 205, 350 L 205, 170 L 265, 275 L 325, 170 L 325, 350" />

    <!-- K: Spine and Diagonals -->
    <path d="M 365, 170 L 365, 350" />
    <path d="M 440, 170 L 375, 260 L 445, 350" />
  </g>
</svg>