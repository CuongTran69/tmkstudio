<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Titanium -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181f"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Inner Border Highlight -->
    <linearGradient id="borderHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>

    <!-- Drop Shadow for Letters -->
    <filter id="letterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Apple Squircle Container (continuous curvature r=114 on 512) -->
  <rect x="8" y="8" width="496" height="496" rx="114" ry="114" fill="url(#bgGradient)"/>
  
  <!-- Outer Bevel Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="114" ry="114" fill="none" stroke="url(#borderHighlight)" stroke-width="3"/>
  <rect x="11" y="11" width="490" height="490" rx="111" ry="111" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- TMK Typographic Wordmark -->
  <g filter="url(#letterGlow)">
    <text 
      x="50%" 
      y="55%" 
      dominant-baseline="middle" 
      text-anchor="middle" 
      fill="url(#metalGradient)" 
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="168" 
      letter-spacing="-3"
    >
      TMK
    </text>
  </g>
</svg>